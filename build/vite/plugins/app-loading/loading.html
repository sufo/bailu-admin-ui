<style data-app-loading="inject-css">
  html.dark .loading-wrap {
    background-color: #1c1e23;
  }

  html.dark .loading {
    background-color: #2c344a;
  }

  html.dark .loading-title {
    color: rgb(255 255 255 / 85%);
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    line-height: 1.5;
  }

  .loading-wrap {
    position: fixed;
    left: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    padding: 0;
  }

  .loading {
    width: 200px;
    height: 200px;
    /* background-color: coral; */
    background-color: var(--primary-color, #1890ff);
    -webkit-animation: squareToCircle 2s 1s infinite alternate;
    animation: squareToCircle 2s 1s infinite alternate;
  }

  .loading-title {
    font-weight: 500;
    color: rgb(0 0 0 / 85%);
    font-size: 30px;
    margin: 50px;
    padding: 0;
  }


  @keyframes squareToCircle {
    0% {
      border-radius: 0 0 0 0;
      background: var(--primary-color, #1890ff);
      transform: rotate(0deg);
    }

    25% {
      border-radius: 50% 0 0 0;
      background: color-mix(in srgb, var(--primary-color, #1890ff), transparent 20%);
      transform: rotate(45deg);
    }

    50% {
      border-radius: 50% 50% 0 0;
      background: color-mix(in srgb, var(--primary-color, #1890ff), transparent 40%);
      transform: rotate(90deg);
    }

    75% {
      border-radius: 50% 50% 50% 0;
      background: color-mix(in srgb, var(--primary-color, #1890ff), transparent 60%);
      transform: rotate(135deg);
    }

    100% {
      border-radius: 50% 50% 50% 50%;
      background: color-mix(in srgb, var(--primary-color, #1890ff), transparent 80%);
      transform: rotate(180deg);
    }
  }
</style>

<div class="loading-wrap" id="__app-loading__">
  <div class="loading"></div>
  <h2 class="loading-title">
    <%= title %>
  </h2>
</div>
